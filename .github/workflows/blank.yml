name: Test and Deploy BaseAtomicArbitrage

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Deploy to Base Mainnet
        run: |
          forge create --rpc-url "${{ secrets.ALCHEMY_BASE_RPC_URL }}" \
            --private-key "${{ secrets.PRIVATE_KEY }}" \
            src/BaseAtomicArbitrage.sol:BaseAtomicArbitrage \
            --constructor-args 0x63Fd24a09B2d8eAa2eb16277B7C3B17512294143 \
            --broadcast
